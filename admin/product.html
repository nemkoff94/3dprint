<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Товар | 3Dело</title>
    <meta name="description" content="Редактирование товара" />
    <link rel="stylesheet" href="/admin-assets/css/admin.css" />
  </head>
  <body data-admin-page="product-form">
    <header class="admin-header">
      <div class="admin-header-inner">
        <a href="/admin/orders" class="admin-brand">3Dело</a>
        <nav class="admin-nav" aria-label="Админ навигация">
          <a href="/admin/orders">Заявки</a>
          <a href="/admin/products" aria-current="page">Товары</a>
        </nav>
        <button id="logoutBtn" type="button" class="admin-btn admin-btn-ghost">Выйти</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-title-row">
        <a href="/admin/products" class="admin-back-link">Назад к товарам</a>
        <h1 id="productFormTitle">Добавить товар</h1>
      </section>

      <section class="admin-detail-card">
        <form id="productForm" class="admin-product-form" novalidate>
          <div class="admin-product-grid">
            <label>
              Название
              <input name="name" type="text" placeholder="Например: КОФЕЙНЯ" required />
            </label>

            <label>
              URL (slug)
              <input name="slug" type="text" placeholder="kofeynya" required />
            </label>

            <label>
              Категория
              <select name="category" required>
                <option value="cafes">Кафе и рестораны</option>
                <option value="shops">Магазины</option>
                <option value="beauty">Салоны красоты</option>
                <option value="flowers">Цветочные магазины</option>
                <option value="offices">Офисы</option>
                <option value="other">Другое</option>
              </select>
            </label>

            <label>
              Тип
              <select name="type" required>
                <option value="volumetric-letters">Объёмные буквы</option>
                <option value="ready-sign">Готовая вывеска</option>
                <option value="logo">Логотип</option>
                <option value="sign">Табличка</option>
                <option value="other">Другое</option>
              </select>
            </label>

            <label class="admin-field-wide">
              Короткое описание
              <textarea name="short_description" rows="3"></textarea>
            </label>

            <label class="admin-field-wide">
              Полное описание
              <textarea name="description" rows="5"></textarea>
            </label>

            <label>
              Цена от
              <input name="price_from" type="number" min="0" step="1" required />
            </label>

            <label>
              Высота (мм)
              <input name="height" type="number" min="0" step="1" />
            </label>

            <label>
              Ширина (мм)
              <input name="width" type="number" min="0" step="1" />
            </label>

            <label>
              Глубина (мм)
              <input name="depth" type="number" min="0" step="1" />
            </label>

            <label>
              Материал
              <input name="material" type="text" placeholder="PLA" />
            </label>

            <label>
              Цвет
              <input name="color" type="text" placeholder="Белый" />
            </label>

            <label>
              Подсветка
              <input name="lighting" type="text" placeholder="Опционально" />
            </label>

            <label>
              Шрифт
              <input name="font" type="text" />
            </label>

            <label>
              Крепление
              <input name="mounting" type="text" />
            </label>

            <label>
              Порядок
              <input name="sort_order" type="number" min="0" step="1" value="1000" />
            </label>

            <label>
              Изображение
              <input name="image" type="file" accept="image/jpeg,image/png,image/webp" />
              <small id="currentImageHint" class="admin-helper-text"></small>
            </label>

            <label class="admin-checkbox-row">
              <input name="is_active" type="checkbox" checked />
              <span>Опубликован</span>
            </label>
          </div>

          <p id="productFormMessage" class="admin-error-text" role="alert" aria-live="polite"></p>

          <div class="admin-form-actions">
            <button type="submit" class="admin-btn admin-btn-primary" id="saveProductBtn">Сохранить товар</button>
            <button type="button" class="admin-btn admin-btn-danger" id="deleteProductBtn" hidden>Удалить</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/admin-assets/js/auth.js" defer></script>
    <script src="/admin-assets/js/products.js" defer></script>
  </body>
</html>
